# Salin ke /etc/nginx/sites-available/kosku lalu:
#   sudo ln -s /etc/nginx/sites-available/kosku /etc/nginx/sites-enabled/kosku
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ganti SOCKET sesuai versi PHP di server, cek: ls /run/php/
#   contoh: php8.3-fpm.sock / php8.4-fpm.sock / php8.5-fpm.sock

server {
    listen 80;
    listen [::]:80;

    server_name _;   # IP publik boleh dibiarkan "_" atau isi IP-nya

    root /var/www/kosku/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }
}